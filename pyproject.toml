# Tool configuration only. Runtime dependencies live in requirements.txt.

[tool.pytest.ini_options]
minversion = "8.0"
# `app` is importable without installing the project, and without sys.path hacks
# in conftest.py.
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "network: hits a live external data provider; deselect with -m 'not network'",
    "slow: takes more than a second or two",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]  # asserts are the point

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/__init__.py", "*/api/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
