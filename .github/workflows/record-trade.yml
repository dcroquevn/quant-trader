# Record a purchase or a sale from your phone.
#
# WHY THIS EXISTS
#   `python -m app buy` needs a terminal, and the moment you most want to record a trade is the
#   moment you just made one -- in a broker's app, away from the computer. An unrecorded position
#   is an unwatched position, so the friction is not cosmetic: it is the difference between the
#   daily check covering your portfolio and silently covering nothing.
#
#   GitHub's mobile app can run a workflow with inputs, which turns this into a form on a phone.
#
# WHAT IT DOES NOT DO
#   It does not buy or sell anything, and it cannot. There is no broker connection anywhere in
#   this project. You trade in your broker's app; this records what you did so the exit rule can
#   be watched against it.
#
# THE SYMBOL LIST IS GENERATED
#   From the declared universe, by scripts in the repository history. A free-text ticker fails
#   only after the runner has spent two minutes installing dependencies, which leaves you unsure
#   whether the trade was recorded. Re-generate it when the universe changes.
#
# WHERE THE POSITIONS LIVE
#   In `data/positions.json`, committed back by this workflow. Not in the Actions cache: that is
#   evicted after about a week of disuse, and while price history re-downloads in minutes,
#   nothing can rebuild what you bought.

name: Record a trade

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What you did'
        type: choice
        options: [buy, sell]
        default: buy
        required: true
      symbol:
        description: 'Which instrument'
        type: choice
        required: true
        options:
          - SPY
          - QQQ
          - DIA
          - IWM
          - AAPL
          - MSFT
          - NVDA
          - AMZN
          - META
          - GOOGL
          - TSLA
          - AMD
          - JPM
          - V
          - AVGO
          - SQM
          - BSAC
          - BCH
          - ENIC
          - CCU
          - ECH
          - AAXJ
          - EEM
          - MCHI
          - ASHR
          - INDA
          - EWY
          - EWT
          - EIDO
          - EWS
          - EWM
          - THD
          - VNM
          - TSM
          - BABA
          - PDD
          - JD
          - NTES
          - INFY
          - HDB
          - IBN
          - SE
      amount:
        description: 'Cash you spent (buy). Leave blank on a sell.'
        type: string
        default: ''
      currency:
        description: 'Currency of the amount'
        type: choice
        options: [USD, CLP]
        default: USD
      price:
        description: 'Price per share. Blank uses the last close, flagged as an estimate.'
        type: string
        default: ''
      note:
        description: 'Anything worth remembering'
        type: string
        default: ''

# Shares the watch's group so the two never write the same SQLite file at once. A trade recorded
# while the daily check was mid-run could be lost, or could corrupt the file.
concurrency:
  group: quant-trader-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data
          key: quant-trader-db-${{ github.run_id }}
          restore-keys: |
            quant-trader-db-

      # The committed file is the source of truth for positions; the cache is a convenience.
      # If the cache was evicted, this is what brings them back.
      - name: Load committed positions
        env:
          PYTHONPATH: backend
        run: python -m app positions-import

      # Needed to derive the stop and target, and to price the trade when no price is given.
      # Incremental, so this is quick once the cache is warm.
      - name: Update bars
        env:
          PYTHONPATH: backend
        run: python -m app download-data --symbols ${{ inputs.symbol }}

      - name: Record it
        env:
          PYTHONPATH: backend
          PAPER_TRADING: 'true'
          LIVE_TRADING: 'false'
        run: |
          set -e
          ARGS=""
          if [ -n "${{ inputs.price }}" ]; then ARGS="$ARGS --price ${{ inputs.price }}"; fi
          if [ -n "${{ inputs.note }}" ]; then ARGS="$ARGS --note '${{ inputs.note }}'"; fi

          if [ "${{ inputs.action }}" = "buy" ]; then
            if [ -z "${{ inputs.amount }}" ]; then
              echo "::error::A buy needs an amount -- the cash you spent."
              exit 1
            fi
            eval python -m app buy "${{ inputs.symbol }}" \
              --amount "${{ inputs.amount }}" \
              --currency "${{ inputs.currency }}" \
              --broker fintual $ARGS
          else
            eval python -m app sell "${{ inputs.symbol }}" $ARGS
          fi

      - name: Show the result
        if: always()
        env:
          PYTHONPATH: backend
        run: |
          {
            echo "## ${{ inputs.action }} ${{ inputs.symbol }}"
            echo
            echo '```'
            python -m app holdings --all || true
            echo '```'
            echo
            echo "_Recorded what you did. No order was placed; nothing here can place one._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the positions file
        run: |
          if git diff --quiet -- data/positions.json; then
            echo "No change to data/positions.json."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/positions.json
          git commit -m "Record ${{ inputs.action }}: ${{ inputs.symbol }}"
          git push

      - name: Keep the database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: quant-trader-db-${{ github.run_id }}
