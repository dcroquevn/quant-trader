# Send one test message, so a failure has exactly one possible cause.
#
# The daily job also proves Telegram works, but it downloads ten years of bars, runs the
# strategy and builds a digest on the way. If nothing arrives, the user is left guessing which
# of those broke. This one installs and sends -- still a couple of minutes, since the install
# is the same, but there is only one thing that can have failed.
#
# It prints whether each secret is present before it tries the network, because a missing secret
# is the common case and needs no round trip to diagnose. The token is never echoed in full: the
# summary gets pasted into chats.

name: 3. Test Telegram (run this once)

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The full set, despite only the notifier being exercised: app/__main__.py imports
      # sqlalchemy and the data layer at module load, so a trimmed install cannot even reach
      # the command. Trimming it would need the CLI to defer those imports, which is a real
      # change and not one worth making for a diagnostic.
      - name: Install
        run: pip install -r requirements.txt

      # Whether each secret arrived at all, before any network call. GitHub masks their
      # values in logs, so length and last characters are the most that can be shown -- and
      # they are enough to catch the usual faults: an empty secret, a misspelled name, a
      # trailing space or a pasted quote.
      - name: What the secrets look like
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          {
            echo "## What arrived from the secrets"
            echo
            echo "| Secret | Present | Length | Looks like |"
            echo "|---|---|---:|---|"
            if [ -z "$TOKEN" ]; then
              echo "| TELEGRAM_BOT_TOKEN | **NO** | 0 | not set, or the name is misspelled |"
            else
              echo "| TELEGRAM_BOT_TOKEN | yes | ${#TOKEN} | ends \`...${TOKEN: -4}\` |"
            fi
            if [ -z "$CHAT" ]; then
              echo "| TELEGRAM_CHAT_ID | **NO** | 0 | not set, or the name is misspelled |"
            else
              echo "| TELEGRAM_CHAT_ID | yes | ${#CHAT} | \`$CHAT\` |"
            fi
            echo
            echo "A token from BotFather is normally 45-46 characters and contains a colon."
            echo "A chat id is normally 9-10 digits, sometimes with a leading minus."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send
        id: send
        env:
          PYTHONPATH: backend
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
          PAPER_TRADING: 'true'
          LIVE_TRADING: 'false'
        # Captured so the summary can show it. Something already is not working; sending the
        # user to a second place to read the reason is not help.
        run: |
          set +e
          python -m app notify-test 2>&1 | tee /tmp/notify.log
          # Captured immediately: PIPESTATUS is rewritten by the next command, so reading it
          # after the echo below reported that echo's status and the job passed while the log
          # said "Not delivered".
          STATUS=${PIPESTATUS[0]}
          echo "exit=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Explain the result
        if: always()
        run: |
          {
            echo "## Telegram check"
            echo
            if [ -f /tmp/notify.log ]; then
              echo "### What the check printed"
              echo
              echo '```'
              cat /tmp/notify.log
              echo '```'
              echo
            fi
            if [ "${{ job.status }}" = "success" ]; then
              echo "Delivered. Look at your phone — if the message is there, the daily run can"
              echo "reach you, and you need do nothing else."
            else
              echo ":warning: **Not delivered.** The step above says why. The usual causes:"
              echo
              echo "| Error | Cause |"
              echo "|---|---|"
              echo "| \`missing\` | The secret is not set, or its name is misspelled. It must be exactly \`TELEGRAM_BOT_TOKEN\` and \`TELEGRAM_CHAT_ID\`. |"
              echo "| \`HTTP 404\` | The token does not identify a bot — often angle brackets or a space pasted with it. |"
              echo "| \`HTTP 401\` | The token is wrong or was revoked. Copy it again from @BotFather. |"
              echo "| \`HTTP 400\` | Usually a wrong chat id. Get it from @userinfobot. |"
              echo "| \`HTTP 403\` + *can't send messages to the bot* | The chat id belongs to a **bot**, not to you. Telegram forbids bot-to-bot messages. You need your own account's numeric id. |"
              echo "| \`HTTP 403\` otherwise | The bot is blocked, or you have never messaged it. |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
