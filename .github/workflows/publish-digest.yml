# Publishes the daily digest to GitHub Pages, so it opens on a phone with nothing running.
#
# WHAT GETS PUBLISHED
#   Market analysis only: the universe by region, each instrument's current signal, liquidity,
#   benchmarks and their caveats. `python -m app digest` excludes positions by default and this
#   workflow does not pass --include-holdings. That is the privacy boundary, and it is enforced
#   by the default rather than by anyone remembering.
#
#   Your positions go to Telegram from the `daily-watch` workflow instead. Telegram is private;
#   a Pages site is not.
#
# THE CONSTRAINT THAT DECIDES THIS FOR YOU
#   GitHub Pages serves from a public repository on the free plan. A private repository needs a
#   paid plan to publish Pages. I have NOT verified either against current GitHub pricing --
#   confirm in your own repository's Settings > Pages before relying on it.
#
#   If that holds, your options are:
#
#     Public repo   -- this workflow works; never enable --include-holdings; run `daily-watch`
#                      here too and accept that the job summary is public, or split the watch
#                      into a second private repository.
#     Private repo  -- `daily-watch` works and Telegram carries everything. No Pages, but the
#                      Actions job summary renders in the GitHub mobile app, which covers the
#                      "read it on my phone" need without a public page at all.
#
#   The second is the better default. The digest is nice to look at; the alerts are the point.
#
# NO POSITIONS MEANS NO CACHE NEEDED
#   This job downloads bars fresh each time. It takes a few minutes longer than restoring a cache
#   and removes the only path by which a cached database could reach a public artifact.

name: 4. Publish digest (needs a PUBLIC repo - will fail here)

# MANUAL ONLY, deliberately.
#
# Pages on the free plan serves from a public repository. While this repository is private the
# deploy step cannot succeed, so a daily schedule would mean a red X every weekday for a reason
# that is not a fault -- and a job that always fails teaches you to ignore failures.
#
# Re-enable the schedule by uncommenting the block below once Pages actually works for this
# repository: either it is public, or the plan serves Pages from private repositories.
on:
  # schedule:
  #   - cron: '00 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download bars
        env:
          PYTHONPATH: backend
        run: python -m app download-data --start 2016-01-01

      - name: Build the digest
        env:
          PYTHONPATH: backend
          PAPER_TRADING: 'true'
          LIVE_TRADING: 'false'
        # No --include-holdings. If you ever add it here, the file below becomes world-readable
        # with your position sizes and entry prices in it.
        run: |
          mkdir -p site
          python -m app digest --output site/index.html

      - name: Refuse to publish anything personal
        # A guard rather than a comment: the digest's holdings section is recognisable, and this
        # fails the build instead of publishing it. Cheap insurance against a future edit above.
        run: |
          if grep -q "contains personal position data" site/index.html; then
            echo "::error::The digest contains position data and must not be published."
            exit 1
          fi
          echo "No position data found. Safe to publish."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
